<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Database System Map</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #fff;
        --surface: #f7f7f5;
        --card: #fff;
        --border: #e6e5e3;
        --text: #2c2c2b;
        --muted: #787774;
        --blue: #2783de;
        --line: #aaa7a2;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.05), 0 5px 16px rgba(0, 0, 0, 0.05);
        --toolbar-bg: rgba(255, 255, 255, 0.97);
        --button-bg: #fff;
        --panel-bg: rgba(255, 255, 255, 0.98);
        --popover-bg: rgba(255, 255, 255, 0.99);
        --floating-bg: rgba(255, 255, 255, 0.94);
        --stage-bg: #f4f4f2;
        --grid-dot: #d9d7d3;
        --zone-control-bg: rgba(255, 255, 255, 0.72);
        --zone-control-hover: #fff;
        --edge-label-stroke: #fff;
        --archived-card: #f0efed;
        --archived-stroke: #b8b5b0;
        --archived-bar: #9b9995;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
        font-family:
          Inter,
          ui-sans-serif,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      button,
      input {
        font: inherit;
      }
      .app {
        height: 100%;
        min-height: 650px;
        display: grid;
        grid-template-rows: 104px 1fr;
      }
      .toolbar {
        z-index: 20;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 10px;
        border-bottom: 1px solid var(--border);
        background: var(--toolbar-bg);
      }
      h1 {
        font-size: 19px;
        line-height: 1;
        margin: 0;
        font-weight: 750;
        letter-spacing: -0.015em;
      }
      .toolrow {
        position: relative;
        width: min(760px, calc(100% - 32px));
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .tool-actions {
        position: absolute;
        left: calc(50% + 165px);
        display: flex;
        align-items: center;
        gap: 7px;
      }
      .search {
        position: relative;
        width: 310px;
      }
      .search .search-icon {
        position: absolute;
        left: 11px;
        top: 10px;
        width: 20px;
        height: 20px;
        color: var(--muted);
        fill: none;
        stroke: currentColor;
        stroke-width: 2.25;
        stroke-linecap: round;
      }
      .search input {
        width: 100%;
        height: 40px;
        padding: 0 12px 0 39px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--surface);
        font-size: 13px;
        color: var(--text);
        outline: none;
      }
      .search input:focus {
        border-color: var(--blue);
        box-shadow: 0 0 0 3px rgba(39, 131, 222, 0.12);
      }
      .iconbtn {
        position: relative;
        display: grid;
        place-items: center;
        width: 40px;
        height: 40px;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 50%;
        background: var(--button-bg);
        color: var(--muted);
        cursor: pointer;
      }
      .iconbtn:hover {
        background: var(--surface);
        color: var(--text);
      }
      .iconbtn::after {
        content: attr(data-tooltip);
        position: absolute;
        left: 50%;
        top: 46px;
        transform: translateX(-50%);
        z-index: 40;
        white-space: nowrap;
        padding: 5px 7px;
        border: 1px solid var(--border);
        border-radius: 6px;
        background: #2c2c2b;
        color: #fff;
        font-size: 10px;
        font-weight: 600;
        line-height: 1;
        opacity: 0;
        pointer-events: none;
      }
      .iconbtn:hover::after,
      .iconbtn:focus-visible::after {
        opacity: 1;
      }
      .iconbtn.active {
        color: var(--muted);
        border-color: var(--border);
        background: var(--button-bg);
      }
      .iconbtn svg {
        width: 18px;
        height: 18px;
        fill: none;
        stroke: currentColor;
        stroke-width: 2.3;
        stroke-linecap: round;
        stroke-linejoin: round;
      }
      .stage {
        position: relative;
        min-height: 0;
        overflow: auto;
        cursor: default;
        overscroll-behavior: contain;
        scroll-behavior: auto;
        background: var(--stage-bg);
        background-image: radial-gradient(var(--grid-dot) 1px, transparent 1px);
        background-size: 22px 22px;
      }
      .stage.panning {
        cursor: grabbing;
        scroll-behavior: auto;
      }
      .stage > svg {
        width: 1500px;
        height: 1200px;
        max-width: none;
        display: block;
        touch-action: auto;
        user-select: none;
      }
      .zone {
        stroke-width: 1;
        vector-effect: non-scaling-stroke;
      }
      .zone-title {
        font-size: 16px;
        font-weight: 780;
        letter-spacing: 0.045em;
        fill: var(--text);
      }
      .zone-sub {
        font-size: 10px;
        fill: var(--muted);
      }
      .zone-move {
        cursor: pointer;
      }
      .zone-move rect {
        fill: var(--zone-control-bg);
        stroke: var(--border);
        vector-effect: non-scaling-stroke;
      }
      .zone-move:hover rect {
        fill: var(--zone-control-hover);
        stroke: var(--blue);
      }
      .zone-move path {
        stroke: var(--muted);
        stroke-width: 1.7;
        fill: none;
        vector-effect: non-scaling-stroke;
        pointer-events: none;
      }
      .edge {
        fill: none;
        stroke: var(--line);
        stroke-width: 1.35;
        opacity: 0.46;
        vector-effect: non-scaling-stroke;
      }
      .edge.inactive {
        stroke-dasharray: 2 7;
        stroke-linecap: round;
        opacity: 0.3;
      }
      .edge.active {
        stroke: var(--blue);
        stroke-width: 2.7;
        opacity: 1;
      }
      .edge.dim {
        opacity: 0.035;
      }
      .edge-label {
        font-size: 9px;
        font-weight: 700;
        fill: var(--blue);
        paint-order: stroke;
        stroke: var(--edge-label-stroke);
        stroke-width: 5px;
        opacity: 0;
        pointer-events: none;
      }
      .edge-label.active {
        opacity: 1;
      }
      .node {
        cursor: pointer;
        touch-action: none;
      }
      .node .card {
        fill: var(--card);
        stroke: var(--border);
        stroke-width: 1.1;
        rx: 10;
        filter: drop-shadow(0 2px 3px rgba(0, 0, 0, 0.045));
        vector-effect: non-scaling-stroke;
      }
      .node .bar {
        stroke: none;
      }
      .node .name {
        font-size: 12.5px;
        font-weight: 750;
        fill: var(--text);
      }
      .node .role {
        font-size: 9px;
        fill: var(--muted);
      }
      .node .badgeText {
        font-size: 7.5px;
        font-weight: 800;
        letter-spacing: 0.04em;
      }
      .node .count {
        font-size: 8.5px;
        fill: var(--muted);
      }
      .node .self-badge path {
        fill: none;
        stroke: var(--muted);
        stroke-width: 1.35;
        stroke-linecap: round;
        stroke-linejoin: round;
        vector-effect: non-scaling-stroke;
      }
      .node:hover .card,
      .node.active .card {
        stroke: var(--blue);
        stroke-width: 2;
      }
      .node.archived {
        opacity: 0.5;
      }
      .node.archived .card {
        fill: var(--archived-card);
        stroke: var(--archived-stroke);
        stroke-dasharray: 4 4;
      }
      .node.archived .bar {
        fill: var(--archived-bar);
      }
      .node .badge-toggle {
        cursor: pointer;
      }
      .node .badge-toggle:hover rect {
        stroke: var(--blue);
        stroke-width: 1.1;
      }
      .node.dim {
        opacity: 0.1;
      }
      .node.match .card {
        stroke: #d5803b;
        stroke-width: 2.4;
      }
      .panel {
        position: fixed;
        top: 118px;
        right: 14px;
        width: 300px;
        max-height: calc(100% - 28px);
        overflow: auto;
        padding: 16px;
        border: 1px solid var(--border);
        border-radius: 12px;
        background: var(--panel-bg);
        box-shadow: var(--shadow);
        display: none;
        z-index: 14;
      }
      .panel.open {
        display: block;
      }
      .panel .close {
        position: absolute;
        right: 9px;
        top: 9px;
        width: 32px;
        height: 32px;
        padding: 0;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--button-bg);
        color: var(--text);
        font-size: 18px;
        cursor: pointer;
      }
      .panel .kicker {
        font-size: 10px;
        font-weight: 800;
        letter-spacing: 0.08em;
        color: var(--muted);
        text-transform: uppercase;
        margin-bottom: 7px;
      }
      .panel h2 {
        font-size: 18px;
        margin: 0 36px 5px 0;
      }
      .panel h2 a {
        color: inherit;
        text-decoration: none;
        cursor: pointer;
      }
      .panel h2 a:hover,
      .panel h2 a:focus-visible {
        color: var(--blue);
        text-decoration: underline;
        text-underline-offset: 3px;
      }
      .panel .summary {
        font-size: 12px;
        line-height: 1.45;
        color: var(--muted);
        margin: 0 0 12px;
      }
      .stats {
        display: flex;
        gap: 6px;
      }
      .stat {
        flex: 1;
        padding: 8px;
        border: 1px solid var(--border);
        border-radius: 8px;
        background: var(--surface);
      }
      .stat b {
        display: block;
        font-size: 15px;
      }
      .stat span {
        font-size: 8px;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 0.05em;
      }
      .panel h3 {
        font-size: 10px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        margin: 14px 0 4px;
        color: var(--muted);
      }
      .panel ul {
        list-style: none;
        padding: 0;
        margin: 0;
      }
      .panel li {
        border-top: 1px solid var(--border);
      }
      .panel .rel {
        width: 100%;
        min-height: 43px;
        height: auto;
        padding: 7px 2px;
        border: 0;
        background: transparent;
        text-align: left;
        cursor: pointer;
      }
      .panel .rel:hover {
        color: var(--blue);
      }
      .panel .rel strong {
        display: block;
        font-size: 12px;
      }
      .panel .rel span {
        font-size: 10px;
        color: var(--muted);
      }
      .badge-menu {
        position: absolute;
        z-index: 30;
        display: none;
        min-width: 155px;
        padding: 6px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: var(--popover-bg);
        box-shadow: 0 8px 28px rgba(0, 0, 0, 0.16);
      }
      .badge-menu.open {
        display: block;
      }
      .badge-menu .menu-title {
        padding: 6px 8px 5px;
        font-size: 9px;
        font-weight: 800;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .badge-menu button {
        display: flex;
        width: 100%;
        height: 34px;
        align-items: center;
        gap: 8px;
        padding: 0 9px;
        border: 0;
        border-radius: 6px;
        background: transparent;
        text-align: left;
        font-size: 12px;
        cursor: pointer;
      }
      .badge-menu button:hover,
      .badge-menu button.selected {
        background: var(--surface);
        color: var(--blue);
      }
      .badge-menu .dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
      }
      .legend {
        position: fixed;
        left: 14px;
        bottom: 12px;
        display: flex;
        gap: 12px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--floating-bg);
        box-shadow: var(--shadow);
        font-size: 10px;
        color: var(--muted);
        pointer-events: none;
      }
      .legend i {
        display: inline-block;
        width: 18px;
        height: 2px;
        background: var(--line);
        margin-right: 5px;
        vertical-align: middle;
      }
      .legend i.dotted {
        background: repeating-linear-gradient(
          90deg,
          var(--line) 0 2px,
          transparent 2px 7px
        );
      }
      .hint {
        position: fixed;
        right: 14px;
        bottom: 12px;
        padding: 8px 10px;
        border: 1px solid var(--border);
        border-radius: 9px;
        background: var(--floating-bg);
        box-shadow: var(--shadow);
        font-size: 10px;
        color: var(--muted);
        pointer-events: none;
      }
      @media (max-width: 720px) {
        .app {
          grid-template-rows: 150px 1fr;
        }
        .toolbar {
          gap: 6px;
        }
        .toolrow {
          width: 100%;
          height: 88px;
          justify-content: center;
        }
        .search {
          position: absolute;
          top: 0;
          left: 50%;
          width: 230px;
          transform: translateX(-50%);
        }
        .tool-actions {
          top: 48px;
          left: 50%;
          right: auto;
          transform: translateX(-50%);
        }
        .panel {
          top: 160px;
          right: 10px;
          bottom: 10px;
          left: 10px;
          width: auto;
          max-height: none;
        }
        .hint {
          display: none;
        }
      }
      html[data-theme="dark"] {
        color-scheme: dark;
        --bg: #191919;
        --surface: #252525;
        --card: #292929;
        --border: rgba(255, 255, 255, 0.18);
        --text: #fff;
        --muted: rgba(255, 255, 255, 0.64);
        --blue: #5e9fe8;
        --line: rgba(255, 255, 255, 0.35);
        --toolbar-bg: rgba(25, 25, 25, 0.97);
        --button-bg: #292929;
        --panel-bg: rgba(32, 32, 32, 0.97);
        --popover-bg: rgba(32, 32, 32, 0.97);
        --floating-bg: rgba(32, 32, 32, 0.97);
        --stage-bg: #202020;
        --grid-dot: rgba(255, 255, 255, 0.13);
        --zone-control-bg: rgba(41, 41, 41, 0.82);
        --zone-control-hover: #3a3a3a;
        --edge-label-stroke: #202020;
        --archived-card: #333;
        --archived-stroke: #717171;
        --archived-bar: #777;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme]) {
          color-scheme: dark;
          --bg: #191919;
          --surface: #252525;
          --card: #292929;
          --border: rgba(255, 255, 255, 0.18);
          --text: #fff;
          --muted: rgba(255, 255, 255, 0.64);
          --blue: #5e9fe8;
          --line: rgba(255, 255, 255, 0.35);
          --toolbar-bg: rgba(25, 25, 25, 0.97);
          --button-bg: #292929;
          --panel-bg: rgba(32, 32, 32, 0.97);
          --popover-bg: rgba(32, 32, 32, 0.97);
          --floating-bg: rgba(32, 32, 32, 0.97);
          --stage-bg: #202020;
          --grid-dot: rgba(255, 255, 255, 0.13);
          --zone-control-bg: rgba(41, 41, 41, 0.82);
          --zone-control-hover: #3a3a3a;
          --edge-label-stroke: #202020;
          --archived-card: #333;
          --archived-stroke: #717171;
          --archived-bar: #777;
        }
      }

      .sync-state {
        position: absolute;
        left: 50%;
        top: 50%;
        transform: translate(-50%, -50%);
        z-index: 25;
        display: none;
        min-width: 280px;
        max-width: calc(100% - 40px);
        padding: 18px 22px;
        border: 1px solid var(--border);
        border-radius: 14px;
        background: var(--surface);
        box-shadow: 0 14px 42px rgba(0, 0, 0, 0.12);
        text-align: center;
        color: var(--text);
      }
      .sync-state.show {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .sync-state span {
        color: var(--muted);
        font-size: 12px;
      }
      .sync-state.error {
        border-color: #d97373;
      }
      #refresh.spinning svg {
        animation: map-spin 0.8s linear infinite;
      }
      @keyframes map-spin {
        to {
          transform: rotate(360deg);
        }
      }
      .iconbtn:disabled {
        opacity: 0.55;
        cursor: wait;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="toolbar">
        <h1>DATABASE SYSTEM MAP</h1>
        <div class="toolrow">
          <div class="search">
            <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10.8" cy="10.8" r="6.2" />
              <path d="m15.5 15.5 4.2 4.2" /></svg
            ><input
              id="search"
              aria-label="Find a database"
              placeholder="Find a database…"
            />
          </div>
          <div class="tool-actions">
            <button
              class="iconbtn active"
              id="connections"
              data-tooltip="Connections"
              aria-label="Show connections"
            >
              <svg viewBox="0 0 24 24">
                <path d="M10 13a5 5 0 0 0 7.5.5l2-2a5 5 0 0 0-7-7l-1.1 1.1" />
                <path d="M14 11a5 5 0 0 0-7.5-.5l-2 2a5 5 0 0 0 7 7l1.1-1.1" />
              </svg></button
            ><button
              class="iconbtn"
              id="refresh"
              data-tooltip="Refresh from Notion"
              aria-label="Refresh from Notion"
            >
              <svg viewBox="0 0 24 24">
                <path d="M20 6v5h-5" />
                <path d="M4 18v-5h5" />
                <path d="M18.5 9a7 7 0 0 0-12-2L4 10" />
                <path d="M5.5 15a7 7 0 0 0 12 2L20 14" />
              </svg></button
            ><button
              class="iconbtn active"
              id="snap"
              data-tooltip="Snap to grid"
              aria-label="Snap to grid"
            >
              <svg viewBox="0 0 24 24">
                <rect x="4" y="4" width="6" height="6" />
                <rect x="14" y="4" width="6" height="6" />
                <rect x="4" y="14" width="6" height="6" />
                <rect x="14" y="14" width="6" height="6" />
              </svg></button
            ><button
              class="iconbtn"
              id="cleanup"
              data-tooltip="Clean up cards"
              aria-label="Restore card positions"
            >
              <svg
                viewBox="0 0 24 24"
                style="
                  width: 22px;
                  height: 22px;
                  fill: currentColor;
                  stroke: none;
                "
              >
                <path
                  d="M13 3c0 4.2-2.3 6.5-6.5 6.5 4.2 0 6.5 2.3 6.5 6.5 0-4.2 2.3-6.5 6.5-6.5C15.3 9.5 13 7.2 13 3Z"
                />
                <path
                  d="M5 1c0 2-1 3-3 3 2 0 3 1 3 3 0-2 1-3 3-3-2 0-3-1-3-3ZM6 14c0 2-1 3-3 3 2 0 3 1 3 3 0-2 1-3 3-3-2 0-3-1-3-3Z"
                />
              </svg></button
            ><button
              class="iconbtn"
              id="fit"
              data-tooltip="Fit system"
              aria-label="Fit system"
            >
              <svg viewBox="0 0 24 24">
                <path d="M8 3H3v5M16 3h5v5M21 16v5h-5M3 16v5h5" />
              </svg>
            </button><button
              class="iconbtn"
              id="theme"
              data-tooltip="Use night mode"
              aria-label="Use night mode"
              aria-pressed="false"
            >
              <svg viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20.5 14.4A8.5 8.5 0 0 1 9.6 3.5a8.5 8.5 0 1 0 10.9 10.9Z" />
              </svg>
            </button>
          </div>
        </div>
      </header>
      <main class="stage" id="stage">
        <svg
          id="svg"
          viewBox="0 0 1500 1200"
          role="img"
          aria-label="Interactive Notion database system map"
        >
          <g id="world">
            <g id="zones"></g>
            <g id="edges"></g>
            <g id="edgeLabels"></g>
            <g id="nodes"></g>
          </g>
        </svg>
        <div class="sync-state show" id="syncState">
          <strong>Loading workspace map…</strong>
          <span>Reading the Notion registry securely.</span>
        </div>
        <aside class="panel" id="panel">
          <button class="close" id="close" aria-label="Close">×</button>
          <div class="kicker" id="panelKicker"></div>
          <h2>
            <a
              id="panelTitle"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="Open database"
            ></a>
          </h2>
          <p class="summary" id="panelSummary"></p>
          <div class="stats">
            <div class="stat">
              <b id="incomingCount">0</b><span>Incoming</span>
            </div>
            <div class="stat">
              <b id="outgoingCount">0</b><span>Outgoing</span>
            </div>
            <div class="stat"><b id="totalCount">0</b><span>Total</span></div>
          </div>
          <div id="relationLists"></div>
        </aside>
        <div class="badge-menu" id="badgeMenu"></div>
        <div class="legend">
          <span><i></i>Active relation</span
          ><span><i class="dotted"></i>Archived / legacy</span>
        </div>
        <div class="hint">
          Scroll to move · Pinch to zoom · Hold and drag to pan · Drag cards
        </div>
      </main>
    </div>
    <script>
      const glyphs = {
        notion_gray: "N",
        "flag-checkered_gray": "⚑",
        target_gray: "◎",
        checklist_gray: "✓",
        wrench_gray: "⚙",
        city_gray: "▦",
        badge_gray: "◆",
        "signature-document_gray": "✎",
        feed_gray: "≡",
        dance_gray: "✦",
        verified_gray: "✓",
        rocket_gray: "↗",
        "new-alert_gray": "!",
        "thought-alert_gray": "◇",
        star_gray: "★",
        briefcase_gray: "��",

      function applyLiveData(data) {

      async function refreshLiveData({ quiet = false } = {}) {

      function zoneHeight(cat) {

      function statusStyle(s) {

            Active: ["#E8F1EC", "#367C57"],
            "In Progress": ["#FFF4CE", "#9A6E00"],
            "In Review": ["#FBEBDE", "#A65E25"],
            Pending: ["#F0EFED", "#66635F"],
            Deprecated: ["#EEEDEC", "#6F6C68"],

      function renderZones() {

      function enableDrag(g, n) {

      function openMenu(e, n, type) {

      const BASE_W = 1500;

      stage.addEventListener(
        "gesturechange",
        (e) => {
          e.preventDefault();
          const r = stage.getBoundingClientRect();
          zoomAt(
            gestureBase * e.scale,
            r.left + r.width / 2,
            r.top + r.height / 2,
          );
        },
        { passive: false },
      );
      themeButton.onclick = () => setTheme(!nightMode);
      refreshButton.onclick = () => refreshLiveData();
      connections.onclick = function () {
        showConnections = !showConnections;
        this.classList.toggle("active", showConnections);
        applyFocus(active);
      };
      snap.onclick = function () {
        snapOn = !snapOn;
        this.classList.toggle("active", snapOn);
      };
      cleanup.onclick = () => {
        closeMenu();
        order.forEach(layoutCategory);
        renderAll();
      };
      fit.onclick = () => {
        scale = Math.min(
          (stage.clientWidth - 24) / BASE_W,
          (stage.clientHeight - 24) / BASE_H,
          1,
        );
        tx = 0;
        ty = 0;
        transform();
        stage.scrollTo({ left: 0, top: 0, behavior: "smooth" });
        active = null;
        focusNode(null);
        search.value = "";
        document
          .querySelectorAll(".node")
          .forEach((g) => g.classList.remove("match"));
      };
      search.oninput = (e) => {
        const q = e.target.value.trim().toLowerCase();
        document
          .querySelectorAll(".node")
          .forEach((g) =>
            g.classList.toggle(
              "match",
              !!q && byId[g.dataset.id].n.toLowerCase().includes(q),
            ),
          );
        if (q) {
          const hit = nodes.find((n) => n.n.toLowerCase().includes(q));
          if (hit && active !== hit.id) {
            active = null;
            focusNode(hit.id);
          }
        }
      };
      panel.onpointerdown = (e) => e.stopPropagation();
      badgeMenu.onpointerdown = (e) => e.stopPropagation();
      document.getElementById("close").onclick = (e) => {
        e.preventDefault();
        e.stopPropagation();
        active = null;
        panel.classList.remove("open");
        applyFocus(null);
      };
      setTheme(nightMode);
      transform();
      layoutAll();
      refreshLiveData({ quiet: true });
    </script>
  </body>
</html>
